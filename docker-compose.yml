version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-parking-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://parking_user:parking_pass@db:5432/smart_parking_db
      - SECRET_KEY=smartparking_super_secret_jwt_key_2026_dev_mode_token
      - DEFAULT_CURRENCY=INR
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-parking-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: smart-parking-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=parking_user
      - POSTGRES_PASSWORD=parking_pass
      - POSTGRES_DB=smart_parking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
